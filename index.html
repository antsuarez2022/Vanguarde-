<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#210038">

    <meta
        name="description"
        content="CircleSync helps you build healthier eating, sleep, rest, and focus routines.">

    <title>
        CircleSync | Sign In
    </title>

    <link
        rel="manifest"
        href="./manifest.json">

    <link
        rel="stylesheet"
        href="./styles.css">
</head>


<body id="auth-page">

    <main class="auth-shell">

        <section class="auth-card">

            <div class="brand">

                <div
                    class="brand-icon"
                    aria-hidden="true">

                    ◉

                </div>

                <h1>
                    CircleSync
                </h1>

                <p>
                    Build healthier routines together.
                </p>

            </div>


            <div class="auth-tabs">

                <button
                    id="show-signin-btn"
                    type="button"
                    class="auth-tab active-tab">

                    Sign In

                </button>


                <button
                    id="show-signup-btn"
                    type="button"
                    class="auth-tab">

                    Create Account

                </button>

            </div>


            <!-- =================================================
                 SIGN IN
            ================================================== -->

            <section id="signin-section">

                <div class="auth-copy">

                    <h2>
                        Welcome Back
                    </h2>

                    <p>
                        Sign in using the email and password
                        you created when you registered.
                    </p>

                </div>


                <form
                    id="signin-form"
                    novalidate>

                    <label for="signin-email">
                        Email
                    </label>


                    <input
                        id="signin-email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required>


                    <label for="signin-password">
                        Password
                    </label>


                    <input
                        id="signin-password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required>


                    <button
                        id="login-btn"
                        type="submit">

                        Sign In

                    </button>

                </form>

            </section>


            <!-- =================================================
                 SIGN UP
            ================================================== -->

            <section
                id="signup-section"
                hidden>

                <div class="auth-copy">

                    <h2>
                        Create Your Account
                    </h2>

                    <p>
                        Choose your email and password.
                        You will use these same credentials
                        to sign in after confirming your email.
                    </p>

                </div>


                <form
                    id="signup-form"
                    novalidate>

                    <label for="signup-email">
                        Email
                    </label>


                    <input
                        id="signup-email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required>


                    <label for="signup-password">
                        Create Password
                    </label>


                    <input
                        id="signup-password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="At least 6 characters"
                        minlength="6"
                        required>


                    <label for="signup-confirm-password">
                        Confirm Password
                    </label>


                    <input
                        id="signup-confirm-password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required>


                    <button
                        id="signup-btn"
                        type="submit">

                        Create Account

                    </button>

                </form>

            </section>


            <p
                id="auth-message"
                class="status"
                aria-live="polite">
            </p>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./app.js?v=62"></script>

</body>

</html>
