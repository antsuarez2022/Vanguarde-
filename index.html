```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Sign in to CircleSync and build healthier routines with your accountability circle.">

    <title>CircleSync | Sign In</title>

    <link
        rel="stylesheet"
        href="styles.css">
</head>

<body data-page="auth">

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand-area">

                <h1>
                    CircleSync
                </h1>

                <p class="tagline">
                    Build healthier routines together.
                </p>

            </div>


            <div class="auth-introduction">

                <h2>
                    Welcome
                </h2>

                <p>
                    Sign in or create an account to manage your
                    meals, sleep, rest, focus sessions, and
                    accountability circles.
                </p>

            </div>


            <form
                id="auth-form"
                novalidate>

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    minlength="6"
                    required>


                <button
                    type="submit"
                    id="login-btn">
                    Sign In
                </button>


                <button
                    type="button"
                    id="signup-btn"
                    class="secondary-button">
                    Create Account
                </button>

            </form>


            <p
                id="auth-message"
                class="status-message"
                aria-live="polite">
            </p>


            <p class="privacy-note">
                Your routine information is stored securely
                through your CircleSync account.
            </p>

        </section>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="app.js?v=10"></script>

</body>

</html>
```
