<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="CircleSync helps you build healthier routines with accountability.">

    <title>CircleSync | Sign In</title>

    <link
        rel="stylesheet"
        href="styles.css">
</head>

<body id="auth-page">

    <main class="auth-shell">

        <section class="auth-card">

            <div class="brand">

                <div class="brand-icon">
                    ◉
                </div>

                <h1>
                    CircleSync
                </h1>

                <p>
                    Build healthier routines together.
                </p>

            </div>


            <div class="auth-copy">

                <h2>
                    Welcome
                </h2>

                <p>
                    Sign in or create an account to manage
                    your eating, sleeping, rest, focus,
                    and accountability routines.
                </p>

            </div>


            <form
                id="auth-form"
                novalidate>

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required>


                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="At least 6 characters"
                    minlength="6"
                    required>


                <button
                    id="login-btn"
                    type="submit">

                    Sign In

                </button>


                <button
                    id="signup-btn"
                    type="button"
                    class="secondary">

                    Create Account

                </button>

            </form>


            <p
                id="auth-message"
                class="status"
                aria-live="polite">
            </p>

        </section>

    </main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=51"></script>

</body>

</html>
